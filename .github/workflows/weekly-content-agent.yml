name: Weekly content agent

on:
  schedule:
    # 13:00 UTC every Monday = 07:00 Costa Rica time (UTC-6, no DST)
    - cron: "0 13 * * 1"
  workflow_dispatch: {}

# New articles go to a review pull request instead of straight to main.
# Merging the PR is what publishes them (Cloudflare deploys main).
permissions:
  contents: write
  pull-requests: write

concurrency:
  group: weekly-content-agent
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Skip if last week's review is still open
        id: pending
        run: |
          url=$(gh pr list --state open --json headRefName,url \
            -q '[.[] | select(.headRefName | startswith("content/weekly-"))][0].url // ""')
          echo "url=$url" >> "$GITHUB_OUTPUT"
          if [ -n "$url" ]; then
            echo "A weekly review PR is still open: $url — skipping this run."
            gh pr comment "$url" --body "El agente no preparó artículos nuevos esta semana porque este PR sigue pendiente. Haz *Merge* o *Close* para que la próxima ejecución continúe."
          fi

      - name: Set up Node
        if: steps.pending.outputs.url == ''
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      # Sources listed in earlier review PRs (including discarded ones) are never
      # proposed again. PR descriptions survive even after the branch is deleted.
      - name: Collect sources from earlier review PRs
        if: steps.pending.outputs.url == ''
        run: |
          gh pr list --state closed --limit 100 --json headRefName,body \
            -q '.[] | select(.headRefName | startswith("content/weekly-")) | .body' \
            | perl -nle 'print $1 while /\*\*Fuente:\*\* \[[^\]]*\]\(([^)\s]+)\)/g' \
            | sort -u > "$RUNNER_TEMP/skip-urls.txt"
          echo "$(wc -l < "$RUNNER_TEMP/skip-urls.txt") source(s) from earlier review PRs"

      # Link-preview cards are rendered with the runner's Chrome; the emoji font
      # draws the category emoji on the card.
      # Optional: if this fails the agent still runs and uses og-default.jpg.
      - name: Set up preview-card rendering
        if: steps.pending.outputs.url == ''
        continue-on-error: true
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends fonts-noto-color-emoji >/dev/null
          npm install --no-save --no-package-lock puppeteer-core@23.11.1
          echo "CHROME_PATH=$(command -v google-chrome)" >> "$GITHUB_ENV"

      - name: Run content agent
        if: steps.pending.outputs.url == ''
        id: agent
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          # CATIE's server omits the Sectigo intermediate certificate (checking stays on)
          NODE_EXTRA_CA_CERTS: certs/sectigo-dv-r36.pem
          REVIEW_SUMMARY_PATH: ${{ runner.temp }}/review-summary.md
          SKIP_URLS_PATH: ${{ runner.temp }}/skip-urls.txt
        run: |
          branch="content/weekly-$(date -u +%F)"
          echo "branch=$branch" >> "$GITHUB_OUTPUT"
          # Cloudflare Pages preview alias: branch name with "/" turned into "-".
          export PREVIEW_BASE_URL="https://${branch//\//-}.futurofood.pages.dev"
          node scripts/weekly-content-agent.mjs

      - name: Open review pull request
        if: steps.pending.outputs.url == ''
        env:
          BRANCH: ${{ steps.agent.outputs.branch }}
          SUMMARY: ${{ runner.temp }}/review-summary.md
        run: |
          shopt -s nullglob
          git config user.name "FuturoFood Content Agent"
          git config user.email "actions@users.noreply.github.com"
          git add futurofood-blog.html index.html futurofood.html boletin.html sitemap.xml es
          [ -f scripts/articles-registry.json ] && git add scripts/articles-registry.json
          article_files=(futurofood-article-*.html og/*.jpg og/en/*.jpg)
          [ ${#article_files[@]} -gt 0 ] && git add "${article_files[@]}"
          if git diff --cached --quiet; then
            echo "No new articles this run."
            exit 0
          fi
          git switch -c "$BRANCH"
          git commit -m "content: weekly food-tech news roundup"
          git push --force -u origin "$BRANCH"
          gh pr create --base main --head "$BRANCH" \
            --title "Artículos de la semana — $(date -u +%F)" \
            --body-file "$SUMMARY"
