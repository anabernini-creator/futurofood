name: Weekly content agent

on:
  schedule:
    # 13:00 UTC every Monday = 07:00 Costa Rica time (UTC-6, no DST)
    - cron: "0 13 * * 1"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: weekly-content-agent
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Run content agent
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: node scripts/weekly-content-agent.mjs

      - name: Commit and push if changed
        run: |
          shopt -s nullglob
          git config user.name "FuturoFood Content Agent"
          git config user.email "actions@users.noreply.github.com"
          git add futurofood-blog.html sitemap.xml
          [ -f scripts/articles-registry.json ] && git add scripts/articles-registry.json
          article_files=(futurofood-article-*.html)
          [ ${#article_files[@]} -gt 0 ] && git add "${article_files[@]}"
          if git diff --cached --quiet; then
            echo "No new articles this run."
          else
            git commit -m "content: weekly food-tech news roundup"
            git push
          fi
